services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Service name, not localhost: inside the compose network "redis"
      # resolves to the cache container.
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Named volume so `docker compose down -v` is what clears the cache,
    # and an ordinary restart is not.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:


